name: NopSCADlib documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned NopSCADlib with vcs2l inside Docker
        run: |
          mkdir -p ext
          docker run --rm --init \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/brainboxemb/scad-toolchain-drawing:edge \
            vcs import --input dependencies.repos ext
          test -f ext/NopSCADlib/core.scad
          test -f ext/NopSCADlib/scripts/make_all.py

      - name: Generate complete documentation for spacer example
        run: |
          docker run --rm --init \
            -v "$PWD:/work" \
            -w /work/examples/spacer/v0.1 \
            ghcr.io/brainboxemb/scad-toolchain-drawing:edge \
            xvfb-run -a python /work/ext/NopSCADlib/scripts/make_all.py

      - name: Check generated deliverables
        run: |
          version=examples/spacer/v0.1
          test -s "$version/stls/spacer.stl"
          test -s "$version/stls/spacer.png"
          test -s "$version/assemblies/main_assembled.png"
          test -s "$version/assemblies/main_assembly.png"
          test -s "$version/bom/bom.json"
          test -s "$version/readme.md"
          test -s "$version/readme.html"
          test -s "$version/printme.html"
          grep -q 'Example spacer' "$version/readme.md"

      - name: Upload generated documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: spacer-nopscadlib-docs
          path: |
            examples/spacer/v0.1/readme.md
            examples/spacer/v0.1/readme.html
            examples/spacer/v0.1/printme.html
            examples/spacer/v0.1/stls/
            examples/spacer/v0.1/assemblies/
            examples/spacer/v0.1/bom/
          retention-days: 14

      # Only publish on merged main, not on pull requests. GitHub Actions'
      # default GITHUB_TOKEN can update gh-pages but cannot itself trigger a
      # Pages branch-source deployment; the final deployment step is described
      # in docs/PUBLISHING.md.
      - name: Update gh-pages with generated example documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          site="$(mktemp -d)"
          git worktree add --detach "$site" origin/gh-pages

          target="$site/examples/spacer/v0.1"
          mkdir -p "$target"
          cp examples/spacer/v0.1/readme.html "$target/index.html"
          cp examples/spacer/v0.1/printme.html "$target/printme.html"
          cp examples/spacer/v0.1/readme.md "$target/readme.md"
          cp -a examples/spacer/v0.1/assemblies "$target/"
          cp -a examples/spacer/v0.1/stls "$target/"
          cp -a examples/spacer/v0.1/bom "$target/"

          printf '' > "$site/.nojekyll"
          cat > "$site/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>OpenSCAD Model Archive · BrainboxEmb</title>
          <style>body{font:1.1rem/1.6 system-ui,sans-serif;max-width:780px;padding:2rem;margin:auto}a{color:inherit}</style>
          </head><body>
          <h1>OpenSCAD Model Archive</h1>
          <p>Small independent OpenSCAD models, with their retained versions and generated documentation.</p>
          <h2>Examples</h2>
          <p><a href="examples/spacer/v0.1/">Spacer — v0.1 (NopSCADlib generated documentation)</a></p>
          <h2>Models</h2><p>No production models archived yet.</p>
          <p><a href="https://github.com/brainboxemb/2026-011-01.cad.model-archive">Source repository</a></p>
          </body></html>
          HTML

          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add -A
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" commit -m "Publish NopSCADlib example documentation from ${GITHUB_SHA:0:12}"
            git -C "$site" push origin HEAD:gh-pages
          else
            echo "Generated documentation unchanged"
          fi
