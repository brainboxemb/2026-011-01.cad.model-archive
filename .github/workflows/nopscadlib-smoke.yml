name: NopSCADlib generated documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      IMAGE: ghcr.io/brainboxemb/scad-toolchain-drawing:edge
      LIBRARY_PATH: /work/ext:/opt/openscad-libraries
    steps:
      - uses: actions/checkout@v4

      # The image is built centrally in brainboxemb/docker.scad-toolchain.
      # No Dockerfile or image build belongs in this model archive.
      - name: Fetch pinned NopSCADlib through shared toolchain
        run: |
          mkdir -p ext
          docker run --rm --init -v "$PWD:/work" -w /work \
            -e OPENSCADPATH="$LIBRARY_PATH" "$IMAGE" \
            vcs import --input dependencies.repos ext
          test -f ext/NopSCADlib/core.scad
          test -f ext/NopSCADlib/scripts/make_all.py

      - name: Generate spacer example documentation
        run: |
          docker run --rm --init -v "$PWD:/work" \
            -w /work/examples/spacer/v0.1 \
            -e OPENSCADPATH="$LIBRARY_PATH" "$IMAGE" \
            xvfb-run -a python /work/ext/NopSCADlib/scripts/make_all.py

      - name: Render six corner-bracket design stages
        shell: bash
        run: |
          set -euo pipefail
          root="models/corner_bracket/v0.1"
          mkdir -p "$root/design"
          for stage in 01_profile 02_edge_chamfers 03_nut_pockets 04_print_relief 05_access_plugs 06_installed; do
            docker run --rm --init -v "$PWD:/work" \
              -w "/work/$root" \
              -e OPENSCADPATH="$LIBRARY_PATH" "$IMAGE" \
              xvfb-run -a openscad --imgsize=800,600 --viewall --autocenter \
                -D "design_step=\"$stage\"" \
                -o "design/$stage.png" scad/design.scad
            test -s "$root/design/$stage.png"
          done

      - name: Generate corner-bracket BOM, STL and documentation
        run: |
          docker run --rm --init -v "$PWD:/work" \
            -w /work/models/corner_bracket/v0.1 \
            -e OPENSCADPATH="$LIBRARY_PATH" "$IMAGE" \
            xvfb-run -a python /work/ext/NopSCADlib/scripts/make_all.py

      - name: Check generated deliverables
        shell: bash
        run: |
          set -euo pipefail
          spacer=examples/spacer/v0.1
          test -s "$spacer/stls/spacer.stl"
          test -s "$spacer/stls/spacer.png"
          test -s "$spacer/assemblies/main_assembled.png"
          test -s "$spacer/bom/bom.json"
          test -s "$spacer/readme.html"
          grep -q 'Example spacer' "$spacer/readme.md"

          bracket=models/corner_bracket/v0.1
          test -s "$bracket/stls/corner_bracket.stl"
          test -s "$bracket/stls/access_plugs.stl"
          test -s "$bracket/assemblies/main_assembled.png"
          test -s "$bracket/bom/bom.json"
          test -s "$bracket/readme.md"
          test -s "$bracket/readme.html"
          test -s "$bracket/printme.html"
          grep -q 'Corner bracket' "$bracket/readme.md"
          for stage in 01_profile 02_edge_chamfers 03_nut_pockets 04_print_relief 05_access_plugs 06_installed; do
            test -s "$bracket/design/$stage.png"
            grep -q "design/$stage.png" "$bracket/readme.md"
          done

      - name: Upload generated documentation previews
        uses: actions/upload-artifact@v4
        with:
          name: nopscadlib-generated-documentation
          path: |
            examples/spacer/v0.1/readme.md
            examples/spacer/v0.1/readme.html
            examples/spacer/v0.1/printme.html
            examples/spacer/v0.1/stls/
            examples/spacer/v0.1/assemblies/
            examples/spacer/v0.1/bom/
            models/corner_bracket/v0.1/readme.md
            models/corner_bracket/v0.1/readme.html
            models/corner_bracket/v0.1/printme.html
            models/corner_bracket/v0.1/stls/
            models/corner_bracket/v0.1/assemblies/
            models/corner_bracket/v0.1/bom/
            models/corner_bracket/v0.1/design/
          retention-days: 14
