name: NopSCADlib generated documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate model documentation
        run: bash scripts/ci/generate-docs.sh

      - name: Upload generated documentation previews
        uses: actions/upload-artifact@v4
        with:
          name: nopscadlib-generated-documentation
          path: |
            examples/spacer/v0.1/
            models/corner_bracket/v0.1/
          retention-days: 14

      - name: Publish GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/publish-pages.sh
