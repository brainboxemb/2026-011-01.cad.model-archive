name: Windows model-opening workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-workflow:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for vcs2l
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned NopSCADlib on Windows
        shell: pwsh
        run: |
          python -m pip install vcs2l==1.1.7
          .\bootstrap.ps1
          if (!(Test-Path ext/NopSCADlib/core.scad)) { throw "NopSCADlib missing" }

      # Running a graphical app directly inside an Actions Windows runner is
      # not reliable. This small native executable checks the same launcher
      # parameters and inherited environment without requiring a GUI desktop.
      - name: Verify launcher passes model path and local library environment
        shell: pwsh
        run: |
          $stubRoot = Join-Path $env:RUNNER_TEMP 'openscad-launcher-stub'
          $output = Join-Path $env:RUNNER_TEMP 'launcher-output.txt'
          $env:MODEL_ARCHIVE_TEST_OUTPUT = $output

          # PowerShell 7 Add-Type cannot output a ConsoleApplication executable.
          # The hosted Windows runner already includes the .NET SDK.
          dotnet new console -n Stub -o $stubRoot --framework net8.0 --force
          $code = @'
          using System;
          using System.IO;
          File.WriteAllText(
              Environment.GetEnvironmentVariable("MODEL_ARCHIVE_TEST_OUTPUT")!,
              Environment.GetEnvironmentVariable("OPENSCADPATH") + "\n" + String.Join("\n", args)
          );
          '@
          Set-Content -LiteralPath (Join-Path $stubRoot 'Program.cs') -Value $code
          dotnet publish (Join-Path $stubRoot 'Stub.csproj') -c Release -o (Join-Path $stubRoot 'publish') --no-self-contained
          $stub = Join-Path $stubRoot 'publish/Stub.exe'
          if (!(Test-Path $stub)) { throw 'Native launcher test stub build failed' }

          $example = 'examples/spacer/v0.1/scad/spacer.scad'
          .\scripts\open-model.ps1 -Model $example -OpenSCADExe $stub

          for ($i = 0; $i -lt 40 -and !(Test-Path $output); $i++) {
              Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $output)) { throw "OpenSCAD launcher did not invoke the child executable" }

          $lines = Get-Content $output
          $ext = (Resolve-Path ext).Path
          $model = (Resolve-Path $example).Path
          if ($lines[0] -notlike "$ext*") { throw "OPENSCADPATH does not begin with repo ext/" }
          if ($lines[-1] -ne $model) { throw "Incorrect model path passed to OpenSCAD: $($lines[-1])" }
          Write-Host "Windows launcher correctly passes OPENSCADPATH and model path"
