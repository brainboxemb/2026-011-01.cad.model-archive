<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="555" viewBox="0 0 1140 555" role="img" aria-labelledby="title desc">
<title id="title">Why the elephant-foot hull needs attention where it meets the outside side bevel</title>
<desc id="desc">Three labeled plan diagrams of the horizontal arm tip explain the outer side-edge bevel, where the two-profile elephant-foot hull stops, and the additional local hull used by the current model. X is along the arm, Y across printed width, with geometry exaggerated.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#45576b"/></marker></defs>
<rect width="1140" height="555" fill="#f7f9fc"/>
<text x="29" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20394f">Arm-tip junction: the two bevels meet on a sloping 3D edge</text>
<text x="29" y="71" font-family="Arial,sans-serif" font-size="15" fill="#596979">Schematic X/Y plan of one arm end (the wood-contact face is in Z). Lines are enlarged; not a dimensioned fabrication drawing.</text>
<g font-family="Arial,sans-serif">
<!-- panel one -->
<rect x="25" y="102" width="351" height="380" rx="14" fill="#fff" stroke="#dce4ec"/>
<text x="45" y="137" font-size="19" font-weight="700" fill="#20394f">1. Outside bevel (cs)</text>
<path d="M72 198 H287 L332 348 H72 Z" fill="#4e92ba" stroke="#23618d" stroke-width="2"/>
<path d="M287 198 L332 348" stroke="#164f7a" stroke-width="6" fill="none"/>
<path d="M287 198 L332 348" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="98" y="240" font-size="15" fill="#fff">Bracket material</text>
<text x="215" y="182" font-size="13" fill="#3d566b">Y = +10</text>
<text x="215" y="373" font-size="13" fill="#3d566b">Y = +8</text>
<path d="M92 400 H337" stroke="#45576b" marker-end="url(#a)" stroke-width="1.7"/>
<text x="201" y="428" font-size="16" fill="#45576b">X → arm tip</text>
<text x="46" y="459" font-size="13" fill="#425a70">Blue diagonal: x changes</text>
<text x="46" y="476" font-size="13" fill="#425a70">as the Y coordinate changes.</text>

<!-- panel two -->
<rect x="393" y="102" width="351" height="380" rx="14" fill="#fff" stroke="#dce4ec"/>
<text x="413" y="137" font-size="19" font-weight="700" fill="#20394f">2. Opening hull alone</text>
<path d="M440 198 H655 L700 348 H440 Z" fill="#4e92ba" stroke="#23618d" stroke-width="2"/>
<path d="M440 198 H655" stroke="#f49b40" stroke-width="8"/>
<path d="M655 198 L700 348" stroke="#164f7a" stroke-width="6"/>
<circle cx="655" cy="198" r="9" fill="#fff" stroke="#c44731" stroke-width="3"/>
<path d="M660 185 L700 165" stroke="#c44731" stroke-width="2" fill="none"/>
<text x="520" y="160" font-size="13" fill="#c44731">Junction</text>
<text x="462" y="231" font-size="14" fill="#fff">Orange: EF relief</text>
<text x="462" y="251" font-size="14" fill="#fff">near broad Y face</text>
<text x="421" y="433" font-size="14" fill="#425a70">It does not fully follow the</text>
<text x="421" y="453" font-size="14" fill="#425a70">diagonal side-bevel junction.</text>

<!-- panel three -->
<rect x="761" y="102" width="351" height="380" rx="14" fill="#fff" stroke="#dce4ec"/>
<text x="780" y="137" font-size="19" font-weight="700" fill="#20394f">3. Finished local junction</text>
<path d="M806 198 H1021 L1066 348 H806 Z" fill="#4e92ba" stroke="#23618d" stroke-width="2"/>
<path d="M806 198 H1021" stroke="#f49b40" stroke-width="8"/>
<path d="M1021 198 L1066 348" stroke="#f49b40" stroke-width="8"/>
<path d="M1021 198 L1066 348" stroke="#9e551f" stroke-width="1.7" stroke-dasharray="6 5"/>
<path d="M1065 257 L1074 230" stroke="#45576b" stroke-width="2" fill="none"/>
<text x="934" y="182" font-size="13" fill="#9e551f">Miter hull</text>
<text x="791" y="428" font-size="14" fill="#425a70">Current code uses an extra</text>
<text x="791" y="448" font-size="14" fill="#425a70">short hull at this 3D edge.</text>
</g>
<rect x="34" y="504" width="1072" height="33" rx="7" fill="#e8f2f8"/>
<text x="51" y="526" font-family="Arial,sans-serif" font-size="14.5" fill="#24475f">Design question: can the diagonal condition be encoded in the inputs of the EF hull? Worth testing; not yet demonstrated for the full L.</text>
</svg>