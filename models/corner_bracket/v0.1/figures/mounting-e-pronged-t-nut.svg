<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="E - Countersunk outside bolt, M4 pronged T-nut pressed into plywood from inside">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#203246"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="white"/>
  <rect width="960" height="8" fill="#335f85"/>
  <text x="32" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203246">E — Bolt from OUTSIDE into a pronged M4 T-nut in plywood</text>
  <text x="32" y="69" font-family="Arial,sans-serif" font-size="14" fill="#657789">Concept: a DIN 7991 countersunk bolt + an M4 hammer-in nut fitted from the inside.</text>

  <rect x="25" y="90" width="910" height="382" rx="12" fill="#f6f9fc" stroke="#dae4ee"/>
  <text x="466" y="122" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#335f85">OUTSIDE</text>
  <text x="469" y="447" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#d68c3d">INSIDE</text>
  
  <!-- outer printed bracket and 10 mm plywood -->
  <rect x="380" y="148" width="240" height="64" fill="#335f85" stroke="#244968" stroke-width="2"/>
  <rect x="380" y="212" width="240" height="140" fill="#eed4aa" stroke="#bd9064" stroke-width="2"/>
  <g stroke="#d8af7b" stroke-width="1">
    <line x1="390" y1="216" x2="432" y2="348"/>
    <line x1="430" y1="216" x2="472" y2="348"/>
    <line x1="470" y1="216" x2="512" y2="348"/>
    <line x1="510" y1="216" x2="552" y2="348"/>
    <line x1="550" y1="216" x2="592" y2="348"/>
  </g>

  <!-- T-nut barrel running into the wood, flange is BELOW and bears against wood at y352 -->
  <rect x="485" y="282" width="30" height="70" rx="2" fill="#8998a2" stroke="#41515e" stroke-width="2"/>
  <rect x="458" y="352" width="84" height="13" rx="2" fill="#657481" stroke="#41515e" stroke-width="2"/>
  <!-- teeth point upward into plywood -->
  <path d="M462 352 V327 L478 352 M522 352 L537 327 V352" fill="#657481" stroke="#41515e" stroke-width="2"/>
  <!-- threaded hole and bolt through stack -->
  <rect x="495" y="177" width="10" height="182" fill="#dce4e9" stroke="#536571" stroke-width="1.5"/>
  <g stroke="#4d616e" stroke-width="1.25">
    <line x1="491" y1="292" x2="509" y2="301"/>
    <line x1="491" y1="306" x2="509" y2="315"/>
    <line x1="491" y1="320" x2="509" y2="329"/>
    <line x1="491" y1="334" x2="509" y2="343"/>
  </g>
  <!-- conical countersunk bolt head, flush with bracket top -->
  <path d="M464 148 H536 L507 180 H493 Z" fill="#657481" stroke="#41515e" stroke-width="2"/>
  <rect x="491" y="151" width="18" height="6" rx="1" fill="#dce4e9"/>

  <!-- labeled callouts -->
  <text x="65" y="177" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#335f85">Outside bracket</text>
  <line x1="214" y1="175" x2="376" y2="176" stroke="#335f85" stroke-width="1.5"/>
  <text x="120" y="269" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#986e3d">Plywood, 10 mm</text>
  <line x1="258" y1="266" x2="378" y2="266" stroke="#b88b5c" stroke-width="1.5"/>

  <text x="680" y="150" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#203246">DIN 7991 bolt head</text>
  <text x="680" y="170" font-family="Arial,sans-serif" font-size="14" fill="#657789">(90° countersink)</text>
  <line x1="672" y1="156" x2="541" y2="155" stroke="#657789" stroke-width="1.5"/>

  <text x="672" y="283" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#203246">Threaded barrel</text>
  <text x="672" y="303" font-family="Arial,sans-serif" font-size="14" fill="#657789">in drilled plywood hole</text>
  <line x1="667" y1="285" x2="518" y2="296" stroke="#657789" stroke-width="1.5"/>

  <text x="671" y="359" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#203246">Flange against wood</text>
  <text x="671" y="378" font-family="Arial,sans-serif" font-size="14" fill="#657789">Prongs point INTO plywood</text>
  <line x1="666" y1="355" x2="544" y2="358" stroke="#657789" stroke-width="1.5"/>
  
  <line x1="773" y1="190" x2="773" y2="256" stroke="#203246" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="785" y="226" font-family="Arial,sans-serif" font-size="14" fill="#203246">Bolt</text>
  <text x="785" y="244" font-family="Arial,sans-serif" font-size="14" fill="#203246">direction</text>
  <text x="42" y="496" font-family="Arial,sans-serif" font-size="13" fill="#657789">Not modeled in v0.1. Pre-drilled plywood and accessible inside face required; check barrel length, bolt engagement and plywood strength.</text>
</svg>