<text x="36" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203246">Where is the relief cut on the bracket?</text>
<text x="36" y="68" font-family="Arial,sans-serif" font-size="14" fill="#6b7c8e">Side view of the L profile. Highlighted lines show the wood-facing edge family, not a dimensioned technical drawing.</text>
