<rect x="495" y="95" width="425" height="255" rx="14" fill="#f6f9fc" stroke="#dce5ed"/>
<text x="65" y="128" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#335f85">Hex nut (regular M4)</text>
<text x="520" y="128" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#335f85">Square nut (thin DIN 562)</text>
<polygon points="232,155 277,181 277,231 232,257 187,231 187,181" fill="#687784" stroke="#394d5c" stroke-width="3"/>
<circle cx="232" cy="206" r="19" fill="white" stroke="#394d5c" stroke-width="3"/>
<rect x="662" y="162" width="94" height="94" rx="3" fill="#687784" stroke="#394d5c" stroke-width="3"/>
<circle cx="709" cy="209" r="19" fill="white" stroke="#394d5c" stroke-width="3"/>
<line x1="187" y1="271" x2="277" y2="271" stroke="#335f85" stroke-width="2"/>
<text x="232" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#203246">7 mm across flats</text>
<line x1="662" y1="271" x2="756" y2="271" stroke="#335f85" stroke-width="2"/>
<text x="709" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#203246">7 mm across sides</text>
<text x="80" y="324" font-family="Arial,sans-serif" font-size="14" fill="#203246">Typical height: about 3.2 mm</text>
