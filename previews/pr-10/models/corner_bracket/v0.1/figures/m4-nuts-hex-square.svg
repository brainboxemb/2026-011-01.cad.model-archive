<text x="36" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203246">M4 nut shapes — top view and side thickness</text>
<text x="36" y="71" font-family="Arial,sans-serif" font-size="14" fill="#6b7c8e">Schematic comparisons, not actual measured dimensions. Match the printed pocket to the purchased nut.</text>
