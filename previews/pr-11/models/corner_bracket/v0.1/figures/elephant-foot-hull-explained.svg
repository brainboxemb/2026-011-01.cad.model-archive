<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="565" viewBox="0 0 1160 565" role="img" aria-labelledby="title desc">
<title id="title">How the two local elephant-foot hulls work</title>
<desc id="desc">A cross-section across the printed width shows two separate 0.6 mm reliefs at Y minus ten and plus ten. A close-up shows the original and offset opening profiles and their sloped hull between Y plus 9.4 and plus ten.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#394d63"/></marker>
</defs>
<rect width="1160" height="565" fill="#f7f9fc"/>
<text x="38" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1c354b">Elephant-foot correction: two local hulls, one on each printed face</text>
<text x="39" y="75" font-family="Arial,sans-serif" font-size="15" fill="#5a6676">Cross-section through a straight plywood-facing edge, viewed along the arm. Relief is enlarged for clarity.</text>
<rect x="35" y="101" width="710" height="399" rx="14" fill="#fff" stroke="#d5dfe8"/>
<text x="58" y="135" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1c354b">Whole bracket width (Y axis)</text>
<!-- Cross section: blue material occupies upper side and sloping relief edges -->
<path d="M125 214 H660 V325 L640 351 H145 L125 325 Z" fill="#498bb5" stroke="#235e88" stroke-width="2"/>
<path d="M125 325 L145 351 L125 351 Z" fill="#f49c47" stroke="#ad531b" stroke-width="1.4"/>
<path d="M640 351 L660 325 L660 351 Z" fill="#f49c47" stroke="#ad531b" stroke-width="1.4"/>
<path d="M145 210 V379 M640 210 V379" stroke="#90a8bb" stroke-dasharray="5 6" stroke-width="1.5"/>
<line x1="125" y1="395" x2="660" y2="395" stroke="#394d63" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="375" y="419" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#394d63">Y — printed width W = 20 mm</text>
<g font-family="Arial,sans-serif" font-size="14" fill="#394d63" text-anchor="middle">
 <text x="125" y="374">−10</text><text x="169" y="374">−9.4</text>
 <text x="393" y="374">0</text>
 <text x="619" y="374">+9.4</text><text x="660" y="374">+10</text>
</g>
<text x="385" y="244" font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#fff">Bracket material</text>
<text x="393" y="330" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#fff">Contact edge (unmodified middle)</text>
<path d="M151 348 L190 452" stroke="#b45c24" stroke-width="2" fill="none"/>
<text x="58" y="466" font-family="Arial,sans-serif" font-size="15" fill="#98501e">Left local hull</text>
<path d="M649 346 L583 452" stroke="#b45c24" stroke-width="2" fill="none"/>
<text x="530" y="466" font-family="Arial,sans-serif" font-size="15" fill="#98501e">Right local hull</text>

<rect x="762" y="101" width="362" height="399" rx="14" fill="#fff" stroke="#d5dfe8"/>
<text x="785" y="135" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#1c354b">Close-up: right side</text>
<text x="786" y="165" font-family="Arial,sans-serif" font-size="15" fill="#425c72">Two different opening profiles</text>
<path d="M835 221 H1055 V280 L977 360 H835 Z" fill="#498bb5" stroke="#235e88" stroke-width="2"/>
<path d="M977 360 L1055 280 L1055 360 Z" fill="#f49c47" stroke="#ad531b" stroke-width="2"/>
<line x1="977" y1="203" x2="977" y2="398" stroke="#7e9fb9" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="1055" y1="205" x2="1055" y2="397" stroke="#7e9fb9" stroke-width="1.6" stroke-dasharray="7 5"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#324c63">
 <text x="947" y="418" text-anchor="middle">Y = +9.4</text>
 <text x="1055" y="418" text-anchor="middle">Y = +10</text>
</g>
<text x="792" y="462" font-family="Arial,sans-serif" font-size="15" fill="#98501e">Orange = extra empty volume</text>
<text x="792" y="484" font-family="Arial,sans-serif" font-size="14" fill="#394d63">removed with difference()</text>
<text x="40" y="539" font-family="Arial,sans-serif" font-size="15" fill="#394d63">A hull between the two openings produces a 45° relief. Joining both outside faces in ONE hull would also change the middle.</text>
</svg>